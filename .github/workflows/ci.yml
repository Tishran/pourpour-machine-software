name: CI

on:
  push:
    branches: [webapp, main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r webapp/requirements.txt
      - name: Web app tests
        working-directory: webapp
        run: python -m unittest discover -s tests -v
      - name: Model tests
        run: python -m unittest discover -s ml/tests -v
      - name: Dataset tests
        run: python -m unittest discover -s dataset/tests -v

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile firmware
        working-directory: firmware
        run: pio run
