<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161613" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Рецепт воронки для вашего кофе: фото пачки или название, пошаговые вливания и таймер.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="First Brew">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>First Brew</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-screen="find">
  <main class="app">

    <section class="screen" id="screen-find" aria-labelledby="find-title">
      <header class="bar">
        <h1 class="brand" id="find-title">First Brew</h1>
        <div class="bar-actions">
          <label class="language-switch">
            <span class="visually-hidden" id="language-label"></span>
            <select id="language" aria-labelledby="language-label">
              <option value="ru">RU</option>
              <option value="en">EN</option>
            </select>
          </label>
          <button class="bar-close settings-button" id="open-settings" type="button"><span aria-hidden="true">⚙</span></button>
        </div>
      </header>
      <div class="home-mode" id="home-learn" hidden></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <button type="button" class="button primary big" id="photo-button"></button>
      <button class="button gallery-button" id="gallery-button" type="button"></button>
      <button class="button" id="photo-cancel" type="button" hidden></button>
      <div class="home-mode" id="home-machine" hidden></div>
      <input class="visually-hidden" id="gallery-input" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
      <input class="visually-hidden" id="photo-input" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
      <figure class="scan-preview" id="scan-preview" data-scanning="false" hidden>
        <div class="scan-frame"><img id="scan-image" alt=""></div>
        <figcaption id="scan-caption"></figcaption>
      </figure>
      <form class="search" id="search-form" role="search">
        <label class="label" for="query" id="search-label"></label>
        <div class="search-row">
          <input id="query" type="search" maxlength="120" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
          <button type="button" class="button" id="show-all"></button>
        </div>
      </form>
      <p class="status" id="catalog-status" role="status" aria-live="polite"></p>
      <button class="button builder-entry" id="open-builder" type="button"></button>
      <button class="button mine-entry" id="open-mine" type="button" hidden></button>
      <section class="recents" id="recents" aria-labelledby="recents-title" hidden>
        <h2 class="section" id="recents-title"></h2>
        <div class="results" id="recent-list" role="list"></div>
      </section>
      <div class="results" id="results" role="list" hidden></div>
      <div class="home-mode" id="home-upgrade" hidden></div>
      <button class="text-button home-plans" id="open-plans" type="button"></button>
    </section>

    <section class="screen screen-start" id="screen-start" aria-labelledby="start-title">
      <header class="bar"><span class="brand">First Brew</span></header>
      <h1 class="title" id="start-title" tabindex="-1"></h1>
      <p class="subtitle" id="start-intro"></p>
      <div class="start-cards">
        <button class="start-card" type="button" id="start-learn" data-start-mode="learn"><strong></strong><span></span></button>
        <button class="start-card" type="button" id="start-machine" data-start-mode="machine"><strong></strong><span></span></button>
        <button class="start-card" type="button" id="start-skip" data-start-mode="skip"><strong></strong><span></span></button>
      </div>
    </section>

    <section class="screen screen-settings" id="screen-settings" aria-labelledby="settings-title">
      <header class="bar"><button class="back" id="settings-back" type="button"></button></header>
      <h1 class="title" id="settings-title" tabindex="-1"></h1>
      <div class="settings-body" id="settings-body"></div>
    </section>

    <section class="screen screen-builder" id="screen-construct" aria-labelledby="builder-title">
      <header class="bar">
        <button class="back" id="builder-back" type="button"></button>
        <div class="bar-actions">
          <label class="language-switch">
            <span class="visually-hidden" id="builder-language-label"></span>
            <select id="builder-language" aria-labelledby="builder-language-label">
              <option value="ru">RU</option>
              <option value="en">EN</option>
            </select>
          </label>
          <button class="bar-close" id="builder-close" type="button"><span aria-hidden="true">×</span></button>
        </div>
      </header>
      <div class="builder-progress" aria-live="polite">
        <p id="builder-progress-text"></p>
        <div class="builder-progress-track" aria-hidden="true"><i id="builder-progress-fill"></i></div>
      </div>
      <div class="builder-layout">
        <div class="builder-form-pane">
          <div class="builder-heading">
            <h1 class="title" id="builder-title" tabindex="-1"></h1>
            <button class="button" type="button" id="builder-mode"></button>
          </div>
          <p class="subtitle" id="builder-intro"></p>
          <button class="button builder-photo" id="builder-photo" type="button" hidden></button>
          <input class="visually-hidden" id="builder-photo-input" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
          <p class="status" id="builder-status" role="status" aria-live="polite"></p>
          <div class="note builder-catalog" id="builder-catalog" hidden>
            <p id="builder-catalog-text"></p>
            <button class="button primary" id="builder-catalog-open" type="button"></button>
          </div>
          <form id="builder-form" novalidate>
            <div id="builder-fields"></div>
            <button class="button builder-rebuild" id="builder-rebuild" type="button" hidden></button>
          </form>
          <div class="builder-feedback" id="builder-feedback" hidden></div>
        </div>
        <div class="builder-result-pane" id="builder-result-pane" hidden>
          <div id="builder-result"></div>
          <div id="builder-correction" hidden></div>
        </div>
      </div>
      <div class="cta-bar builder-cta" id="builder-cta">
        <p class="status" id="builder-cta-status" role="status" aria-live="polite"></p>
        <div class="builder-cta-buttons">
          <button type="button" class="button primary big" id="builder-next"></button>
          <button type="button" class="button big" id="builder-secondary" hidden></button>
        </div>
      </div>
    </section>

    <section class="screen screen-mine" id="screen-mine" aria-labelledby="mine-title">
      <header class="bar"><button class="back" id="mine-back" type="button"></button></header>
      <h1 class="title" id="mine-title" tabindex="-1"></h1>
      <p class="subtitle" id="mine-intro"></p>
      <p class="status" id="mine-status" role="status" aria-live="polite"></p>
      <div class="results" id="mine-list" role="list"></div>
      <div class="mine-empty" id="mine-empty" hidden>
        <p class="note" id="mine-empty-text"></p>
        <button class="button builder-entry" id="mine-builder" type="button"></button>
      </div>
    </section>

    <section class="screen screen-own" id="screen-own" aria-labelledby="own-title">
      <header class="bar"><button class="back" id="own-back" type="button"></button></header>
      <div class="own-body" id="own-body"></div>
      <div class="cta-bar own-cta">
        <p class="status" id="own-status" role="status" aria-live="polite"></p>
        <div class="builder-cta-buttons pair">
          <button type="button" class="button primary big" id="own-primary"></button>
          <button type="button" class="button big" id="own-secondary"></button>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-confirm" aria-labelledby="confirm-title">
      <header class="bar"><button class="back" id="confirm-back" type="button"></button></header>
      <div class="recognition-body">
        <h1 class="title" id="confirm-title" tabindex="-1"></h1>
        <img class="recognition-photo" id="confirm-photo" alt="">
        <p class="status" id="confirm-status" role="status" aria-live="polite"></p>
        <div id="recognized-fields"></div>
        <div id="unreadable-help" hidden><p id="photo-tips"></p></div>
      </div>
      <div class="cta-bar recognition-actions">
        <button class="button big" id="confirm-builder" type="button"></button>
        <button class="button primary big" id="confirm-recipe" type="button"></button>
        <button class="button" id="not-this-coffee" type="button"></button>
        <button class="button primary big" id="photo-retake" type="button" hidden></button>
        <button class="button" id="type-name" type="button" hidden></button>
        <button class="text-button" id="general-recipe" type="button" hidden></button>
      </div>
    </section>

    <section class="screen" id="screen-recipe" aria-labelledby="recipe-title">
      <header class="bar">
        <button type="button" class="back" id="recipe-back"></button>
      </header>
      <div class="recipe-photo" id="recipe-photo" hidden>
        <img id="recipe-photo-image" alt="">
        <button class="text-button" id="recipe-photo-label" type="button" aria-expanded="false" aria-controls="recipe-recognition"></button>
      </div>
      <div id="recipe-recognition" hidden></div>
      <div class="recipe-body" id="recipe-body" aria-busy="false">
        <p class="placeholder" id="recipe-placeholder"></p>
      </div>
      <div class="cta-bar" id="recipe-cta" hidden>
        <p class="status" id="cta-status" role="status" aria-live="polite"></p>
        <button type="button" class="button primary big" id="machine-start" hidden></button>
        <div class="builder-cta-buttons pair">
          <button type="button" class="button primary big" id="brew-start"></button>
          <button type="button" class="button big" id="recipe-rate"></button>
        </div>
      </div>
    </section>

    <section class="screen screen-brew" id="screen-brew" aria-labelledby="brew-title">
      <header class="bar">
        <button type="button" class="back" id="brew-back"></button>
        <h1 class="visually-hidden" id="brew-title"></h1>
        <div class="toggles">
          <button type="button" class="toggle" id="brew-vibrate" aria-pressed="true"></button>
          <button type="button" class="toggle" id="brew-sound" aria-pressed="true"></button>
        </div>
      </header>
      <div class="brew-ready" id="brew-ready" hidden>
        <p class="builder-origin" id="brew-ready-origin"></p>
        <h2 class="title" id="brew-ready-name"></h2>
        <p class="subtitle" id="brew-ready-summary"></p>
        <div class="brew-ready-grid" id="brew-ready-grid"></div>
        <p class="note" id="brew-ready-duration"></p>
      </div>
      <div class="brew-face" id="brew-face">
        <p class="brew-phase" id="brew-phase"></p>
        <p class="brew-clock" id="brew-clock" role="timer">0:00</p>
        <p class="brew-action" id="brew-action" role="status" aria-live="polite"></p>
        <p class="brew-countdown" id="brew-countdown"></p>
        <p class="brew-step-count" id="brew-step-count" hidden></p>
        <div class="brew-step-tiles" id="brew-step-tiles" hidden>
          <div><span id="brew-pour-label"></span><strong id="brew-pour-value"></strong></div>
          <div><span id="brew-scale-label"></span><strong id="brew-scale-value"></strong></div>
          <div><span id="brew-rate-label"></span><strong id="brew-rate-value"></strong></div>
        </div>
        <div class="brew-progress" aria-hidden="true"><i id="brew-progress"></i></div>
        <p class="brew-next" id="brew-next"></p>
        <div class="brew-step-nav" id="brew-step-nav" hidden>
          <button type="button" class="button" id="brew-prev-step"></button>
          <button type="button" class="button" id="brew-next-step"></button>
        </div>
      </div>
      <div class="brew-done" id="brew-done" hidden>
        <p class="brew-done-title" id="brew-done-title"></p>
        <p class="brew-done-text" id="brew-done-text"></p>
      </div>
      <div class="brew-controls" id="brew-controls">
        <button type="button" class="button primary big" id="brew-toggle"></button>
        <button type="button" class="button big" id="brew-reset"></button>
      </div>
      <div class="brew-controls" id="brew-done-controls" hidden>
        <button type="button" class="button primary big" id="brew-rate" hidden></button>
        <button type="button" class="button primary big" id="brew-again"></button>
        <button type="button" class="button big" id="brew-new"></button>
      </div>
    </section>

    <section class="screen screen-plans" id="screen-plans" aria-labelledby="plans-title">
      <header class="bar"><button class="back" id="plans-back" type="button"></button></header>
      <h1 class="title" id="plans-title" tabindex="-1"></h1>
      <p class="demo-note" id="plans-demo"></p>
      <div class="plan-cards" id="plan-cards"></div>
      <p class="plans-line" id="plans-cheaper"></p>
      <p class="plans-line plans-lock-in" id="plans-lock-in"></p>
      <p class="status" id="plans-status" role="status" aria-live="polite"></p>
      <aside class="survey-offer" aria-labelledby="survey-title">
        <div class="survey-discount" aria-hidden="true">−15%</div>
        <div class="survey-copy">
          <p class="survey-eyebrow" id="survey-eyebrow"></p>
          <h2 id="survey-title"></h2>
          <p id="survey-text"></p>
          <a class="button survey-button" id="survey-link" href="https://forms.yandex.ru/u/6ab10c8390fa7ba71fa6d1cb" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </aside>
    </section>

  </main>
  <div class="sheet-backdrop" id="lock-sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lock-title" aria-describedby="lock-demo">
      <p class="sheet-eyebrow" id="lock-eyebrow"></p>
      <h2 class="sheet-title" id="lock-title"></h2>
      <p class="demo-note" id="lock-demo"></p>
      <button type="button" class="button primary big" id="lock-plans"></button>
      <button type="button" class="button big" id="lock-later"></button>
    </div>
  </div>
</body>
</html>
