; First Brew machine firmware — ESP32 (Arduino framework), USB serial link to webapp/server.py.
; Build: pio run        Flash: pio run -t upload        Monitor: pio device monitor -b 115200
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    bogde/HX711@^0.7.5
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
