# First Brew web app on coffee.wadymmmmm.ru/app, proxied to the local Python server.
# /etc/nginx/snippets/firstbrew.conf — included inside the existing server block.
# The static site at / keeps working: none of these paths are used by it.

# The app itself.
location = /app {
    proxy_pass http://127.0.0.1:8011/;
    include /etc/nginx/snippets/firstbrew-proxy.conf;
    proxy_read_timeout 30s;
}
location = /app/ {
    proxy_pass http://127.0.0.1:8011/;
    include /etc/nginx/snippets/firstbrew-proxy.conf;
    proxy_read_timeout 30s;
}

# Assets the app requests from the site root.
location = /app.js            { proxy_pass http://127.0.0.1:8011; include /etc/nginx/snippets/firstbrew-proxy.conf; proxy_read_timeout 30s; }
location = /taste-model.js    { proxy_pass http://127.0.0.1:8011; include /etc/nginx/snippets/firstbrew-proxy.conf; proxy_read_timeout 30s; }
location = /style.css         { proxy_pass http://127.0.0.1:8011; include /etc/nginx/snippets/firstbrew-proxy.conf; proxy_read_timeout 30s; }
location = /icon.svg          { proxy_pass http://127.0.0.1:8011; include /etc/nginx/snippets/firstbrew-proxy.conf; proxy_read_timeout 30s; }
location = /icon-192.png      { proxy_pass http://127.0.0.1:8011; include /etc/nginx/snippets/firstbrew-proxy.conf; proxy_read_timeout 30s; }
location = /icon-512.png      { proxy_pass http://127.0.0.1:8011; include /etc/nginx/snippets/firstbrew-proxy.conf; proxy_read_timeout 30s; }
location = /apple-touch-icon.png { proxy_pass http://127.0.0.1:8011; include /etc/nginx/snippets/firstbrew-proxy.conf; proxy_read_timeout 30s; }

# Home-screen manifest: same file as the app ships, with start_url pointing at /app.
location = /manifest.webmanifest {
    alias /var/www/firstbrew/manifest.webmanifest;
    types { } default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}

# Photo recognition: one 8 MB upload, OCR can take up to 30 seconds.
location = /api/label {
    proxy_pass http://127.0.0.1:8011;
    include /etc/nginx/snippets/firstbrew-proxy.conf;
    limit_req zone=firstbrew_ocr burst=4 nodelay;
    client_max_body_size 9m;
    proxy_read_timeout 90s;
}
location = /api/scan {
    proxy_pass http://127.0.0.1:8011;
    include /etc/nginx/snippets/firstbrew-proxy.conf;
    limit_req zone=firstbrew_ocr burst=4 nodelay;
    client_max_body_size 9m;
    proxy_read_timeout 90s;
}

# Live machine telemetry (Server-Sent Events): no buffering, long-lived connection.
location = /api/machine/events {
    proxy_pass http://127.0.0.1:8011;
    include /etc/nginx/snippets/firstbrew-proxy.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

# Everything else under /api: catalog search, recipes, model info, machine commands.
location /api/ {
    proxy_pass http://127.0.0.1:8011;
    include /etc/nginx/snippets/firstbrew-proxy.conf;
    limit_req zone=firstbrew_api burst=20 nodelay;
    client_max_body_size 128k;
    proxy_read_timeout 45s;
}
